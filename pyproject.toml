[project]
name = "shared-recipe-app"
version = "0.1.0"
description = "Shared Recipe Application"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "pillow>=12.0",
    "drf-spectacular>=0.30.0",
    "djangorestframework-camel-case>=1.4.2",
    "django-environ>=0.14.0",
    "pint>=0.24",
    "factory-boy>=3.3.3",
]

[dependency-groups]
dev = [
    "djangorestframework-stubs>=3.18.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

# Not an installable package, just an application tree.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
