openapi: 3.0.3
info:
  title: Shared Recipe Application
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: login
      description: Start a session for an existing account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
          description: ''
  /api/auth/logout/:
    post:
      operationId: logout
      description: End the current session.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/register/:
